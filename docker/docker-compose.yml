services:
  sportscenter-mysql:
    image: "mysql:8.0"
    restart: always
    container_name: "sports-center-mysql"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: sports-center
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql
      - sports-center-mysql-data:/var/lib/mysql
    networks:
      - sportscenter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sportscenter-redis:
    image: "redis:latest"
    restart: always
    container_name: "sports-center-redis"
    ports:
      - "6379:6379"
    volumes:
      - sports-center-redis-data:/data
    networks:
      - sportscenter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  sportscenter-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: always
    container_name: "sports-center-backend"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: sportscenter-redis
      SPRING_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: UTC
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: -1
    ports:
      - "8081:8081"
    depends_on:
      sportscenter-mysql:
        condition: service_healthy
      sportscenter-redis:
        condition: service_healthy
    networks:
      - sportscenter-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/products?PageSize=1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  sportscenter-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: always
    container_name: "sports-center-frontend"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      sportscenter-backend:
        condition: service_healthy
    networks:
      - sportscenter-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  sportscenter-network:
    driver: bridge

volumes:
  sports-center-mysql-data:
  sports-center-redis-data:
